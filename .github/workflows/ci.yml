name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: unit tests and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover tests/unit

      - name: host-test
        run: make -C tests/host CC=gcc test

      - name: Repository hygiene checks
        run: python tools/check_repo.py

      - name: Documentation links and anchors
        run: python tools/check_doc_links.py
