name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: unit tests and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover tests/unit

      - name: Coverage report (informational)
        run: python tools/coverage_report.py

      - name: host-test
        run: make -C tests/host CC=gcc test

      - name: fuzz smoke (PE parser)
        run: make -C tests/fuzz CC=gcc smoke

      - name: static-analysis (informational)
        continue-on-error: true
        run: sh tools/static_analyze.sh

      - name: Shell script lint (bash -n, shellcheck)
        run: bash vm/lint.sh

      - name: Repository hygiene checks
        run: python tools/check_repo.py

      - name: Documentation counts are current
        run: python tools/update_doc_counts.py --check

      - name: Provenance SPDX tag syntax
        run: python tools/provenance_scan.py --check

      - name: Documentation links and anchors
        run: python tools/check_doc_links.py

      - name: Syscall table parity
        run: python tools/check_syscall_tables.py

      - name: Service handler inventory is current
        run: |
          python tools/service_inventory.py --selftest
          python tools/service_inventory.py --markdown --out docs/status/SERVICES.md
          git diff --exit-code -- docs/status/SERVICES.md

      - name: Criteria traceability matrix is current
        run: |
          python tools/criteria_trace.py --selftest
          python tools/criteria_trace.py --markdown --out docs/status/TRACEABILITY.md
          git diff --exit-code -- docs/status/TRACEABILITY.md
