name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: unit tests and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover tests/unit

      - name: Coverage report (informational)
        run: python tools/coverage_report.py

      - name: host-test
        run: make -C tests/host CC=gcc test

      - name: Shell script lint (bash -n, shellcheck)
        run: bash vm/lint.sh

      - name: Repository hygiene checks
        run: python tools/check_repo.py

      - name: Documentation counts are current
        run: python tools/update_doc_counts.py --check

      - name: Provenance SPDX tag syntax
        run: python tools/provenance_scan.py --check

      - name: Documentation links and anchors
        run: python tools/check_doc_links.py

      - name: Syscall table parity
        run: python tools/check_syscall_tables.py
