DOD-MEM-A007:
  verdict: PARTIAL
  candidates:
    - tests/kernel-host/stress_section_test.c
  missing: >-
    (1) volume: the default is 4096 operations (main, line 333), not 10^8; (2) the
    cycles run on threads, not multiple processes; (3) no private RSS plateau or slope is
    measured, only allocation counts and handle counts; (4) no 12-hour nightly soak exists.
  reasoning: >-
    The test drives mixed alloc, map, view, unmap and close operations across threads and
    checks at the end that the allocation count returns to the baseline (line 416,
    STRESS_CHECK(end_allocs == base_allocs)) and that the handle table is empty (line 407).
    That is leak accounting for the same operation mix, so it is the part of the criterion
    it covers. It does not measure the RSS plateau, the slope threshold or the volume.
  harness_result: Not registered. Subset run refused at the lint gate.

